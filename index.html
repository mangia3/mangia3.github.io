/* ══════════════════════════════════════════════════════════════════
   LAYOUT — one engine, two lattices.  Flip MODE to switch.
   ══════════════════════════════════════════════════════════════════ */
const MODE='hex';
document.body.className=MODE;

const COLS=15,ROWS=10;   // tight enough that lit work is never more than 2 cells away
const TW=150,TH=124,TG=7;                         // rect cell
const HR=86,HW=Math.sqrt(3)*HR,HVS=1.5*HR;       // hex cell

const SPAN={project:[2,2],bigpaper:[2,3],paper:[1,2],lab:[2,1],note:[1,1],plaqueBig:[2,2],plaqueSat:[1,1],
            research:[2,3],expt:[1,2],shelf:[2,3],concept:[1,2],labhub:[2,2]};
const TIER={project:'xl',bigpaper:'lg',paper:'md',lab:'md',note:'nt',plaqueBig:'trio',plaqueSat:'trio',
            research:'sub',expt:'sub',shelf:'trio',concept:'md',labhub:'hub'};
/* Two hexes of radius Ra,Rb on adjacent cells meet edge-to-edge when
   Ra+Rb = 2. So the size ladder is bounded, and MORTAR is the visible seam. */
const MORTAR=0.05;
/* xlp 1.28 + sat 0.67 = 1.95, so contact exactly touches about while being
   noticeably larger than a bare satellite would allow at xl 1.40 */
const HEXR={xl:1.40,xlp:1.28,lg:1.24,md:.98,nt:1.06,sat:.67,dec:.98,
            hub:1.05,sub:.89,tuck:.66,trio:.975,tri:1.04,tris:.90};
const DEPTH={xl:40,xlp:36,lg:30,md:18,nt:20,sat:26,hub:28,sub:20,tuck:24,trio:26,tri:30,tris:24};
const KIND={project:'Built project',bigpaper:'Paper',paper:'Paper / experiment',
            lab:'Laboratory',note:'Note',plaqueBig:'Orientation',plaqueSat:'Contact',
            research:'Research project',expt:'Experiment',shelf:'Recommended',concept:'Concept',
            labhub:'Laboratory'};

const HOX=64,HOY=64;   // large cells overhang the lattice; inset so nothing goes negative
const hexCentre=(c,r)=>({cx:HOX+HW*c+(r%2?HW/2:0)+HW/2, cy:HOY+HVS*r+HR});
function boxFor(cfg,tier){
  if(MODE==='rect'){
    const [sc,sr]=cfg.span||[1,1];
    if(tier==='nt'){                              // notes are circles → square box
      const d=TH*1.06, cx=cfg.col*(TW+TG)+TW/2, cy=cfg.row*(TH+TG)+TH/2;
      return {x:cx-d/2,y:cy-d/2,w:d,h:d};
    }
    return {x:cfg.col*(TW+TG), y:cfg.row*(TH+TG),
            w:sc*TW+(sc-1)*TG, h:sr*TH+(sr-1)*TG};
  }
  const {cx,cy}=hexCentre(cfg.col,cfg.row);
  const r=(cfg.radius!==undefined?cfg.radius:HEXR[tier])*HR;
  return {x:cx-Math.sqrt(3)*r/2, y:cy-r, w:Math.sqrt(3)*r, h:2*r};
}
const hexNeighbours=(c,r)=> r%2
  ? [[c-1,r],[c+1,r],[c,r-1],[c+1,r-1],[c,r+1],[c+1,r+1]]
  : [[c-1,r],[c+1,r],[c-1,r-1],[c,r-1],[c-1,r+1],[c,r+1]];

const wallEl=document.getElementById('wall'),worldEl=document.getElementById('world'),
      floraEl=document.getElementById('flora'),vpEl=document.getElementById('viewport');

/* ── occupancy ─────────────────────────────────────────────────────
   Rect mode reserves the span. Hex mode reserves nothing: instead every
   cell is given the largest radius that still clears its neighbours, so
   the lattice grades down around the big cells and no cell is ever empty.
   ────────────────────────────────────────────────────────────────── */
const occ=new Set(), warn=[], cellR={};
if(MODE==='rect'){
  WORK.forEach(w=>{
    const [sc,sr]=SPAN[w.cat];
    for(let r=w.row;r<w.row+sr;r++)for(let c=w.col;c<w.col+sc;c++){
      if(c>=COLS||r>=ROWS)warn.push(w.id+' off-grid');
      if(occ.has(c+','+r))warn.push(w.id+' overlaps at '+c+','+r);
      occ.add(c+','+r);
    }
  });
}else{
  WORK.forEach(w=>{ cellR[w.col+','+w.row]=HEXR[TIER[w.cat]]; occ.add(w.col+','+w.row); });
  WORK.forEach(w=>hexNeighbours(w.col,w.row).forEach(([c,r])=>{
    const o=WORK.find(x=>x.col===c&&x.row===r); if(!o)return;
    const sum=HEXR[TIER[w.cat]]+HEXR[TIER[o.cat]];
    if(sum>2-MORTAR) warn.push(`${w.id}+${o.id} adjacent, combined ${sum.toFixed(2)} > ${(2-MORTAR).toFixed(2)}`);
  }));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const k=c+','+r; if(cellR[k]!==undefined)continue;
    let rad=HEXR.dec;
    hexNeighbours(c,r).forEach(([nc,nr])=>{
      const nv=cellR[nc+','+nr];
      rad=Math.min(rad, 2-MORTAR-(nv!==undefined?nv:HEXR.dec));
    });
    cellR[k]=Math.max(0.34,rad);
  }
}
const SHADOW=[],LIVE=[],GAPS=[];
/* Cells touching a heavy cell are more likely to have fallen out: the big
   cells stress the surrounding structure, and it gives the vines a cavity to
   spill from right where the important work is. */
const NEARBIG=new Set();
WORK.forEach(w=>{
  const t=TIER[w.cat]; if(t!=='xl'&&t!=='lg')return;
  if(MODE==='hex') hexNeighbours(w.col,w.row).forEach(([c,r])=>NEARBIG.add(c+','+r));
  else{const[sc,sr]=SPAN[w.cat];
    for(let r=w.row-1;r<=w.row+sr;r++)for(let c=w.col-1;c<=w.col+sc;c++)NEARBIG.add(c+','+r);}
});
/* Effective solid area of a living tile. A hexagon fills about 75% of its
   bounding box and leaves the corners empty, so tests against the raw box
   reject foliage that would never actually touch the tile. */
const SOLID = MODE==='hex' ? 0.80 : 1.0;
function solidBox(L){
  if(SOLID===1) return L;
  const w=L.w*SOLID, hh=L.h*SOLID;
  return {x:L.x+(L.w-w)/2, y:L.y+(L.h-hh)/2, w, h:hh};
}
let WALL_W=0,WALL_H=0;
const HEXPTS='50 0,100 25,100 75,50 100,0 75,0 25';
/* Substrate: debris settled into the bottom of a cavity. It gives the plants
   a surface to sit on, hides their origin point, and fixes the soil line at a
   known fraction of the cell height so plant bases can be placed exactly. */
const SOIL_TOP=0.70;
function substrate(w,h){
  const top=h*SOIL_TOP, f=v=>v.toFixed(1);
  let s=`<svg class="soil" viewBox="0 0 ${f(w)} ${f(h)}" preserveAspectRatio="none">`;
  const lip=`M0,${f(top+4)} Q${f(w*.18)},${f(top-5)} ${f(w*.36)},${f(top)}
      Q${f(w*.54)},${f(top-7)} ${f(w*.72)},${f(top-1)} Q${f(w*.88)},${f(top-6)} ${f(w)},${f(top+3)}`;
  /* the bed itself, warm enough to read as soil rather than shadow */
  s+=`<path fill="#463726" d="${lip} L${f(w)},${f(h)} L0,${f(h)} Z"/>`;
  s+=`<path fill="#2C2116" opacity=".85" d="${lip} L${f(w)},${f(h)} L0,${f(h)} Z"
        transform="translate(0,${f(h*.12)})"/>`;
  /* lit crest along the surface, which is what makes it legible as a bed */
  s+=`<path fill="none" stroke="#7A6A4E" stroke-width="${f(Math.max(1.6,w/70))}"
        stroke-linecap="round" opacity=".75" d="${lip}"/>`;
  s+=`<path fill="none" stroke="#9C8A66" stroke-width="${f(Math.max(.9,w/150))}"
        stroke-linecap="round" opacity=".5" d="${lip}" transform="translate(0,${f(-w/120)})"/>`;
  const rock=['#6B6152','#7A7060','#585044','#847A66'];
  const n=Math.round(w/13);
  for(let i=0;i<n;i++){
    const rx=rr(4,13)*(w/150), ry=rx*rr(.5,.85);
    const cx=rr(rx,w-rx), cy=top+rr(-2,h*.2);
    const c=rock[ri(0,3)];
    s+=`<ellipse cx="${f(cx)}" cy="${f(cy+ry*.5)}" rx="${f(rx*1.05)}" ry="${f(ry*.5)}" fill="#241A11" opacity=".6"/>`;
    s+=`<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${c}"/>`;
    s+=`<path fill="rgba(226,214,186,.42)" d="M${f(cx-rx*.7)},${f(cy-ry*.34)}
        Q${f(cx)},${f(cy-ry*1.05)} ${f(cx+rx*.7)},${f(cy-ry*.34)}
        Q${f(cx)},${f(cy-ry*.5)} ${f(cx-rx*.7)},${f(cy-ry*.34)} Z"/>`;
  }
  for(let i=0;i<10;i++)  // grit catching the light along the surface
    s+=`<circle cx="${f(rr(4,w-4))}" cy="${f(top+rr(-3,7))}" r="${f(rr(.9,2.4))}" fill="#8B7C5E" opacity=".65"/>`;
  return s+`</svg>`;
}

function mkTile(box,cls,tier,html){
  const t=document.createElement('div');
  t.className='t '+cls+(tier?' '+tier:'');
  t.style.cssText=`left:${box.x.toFixed(0)}px;top:${box.y.toFixed(0)}px;width:${box.w.toFixed(0)}px;height:${box.h.toFixed(0)}px`;
  t.dataset.cx=(box.x+box.w/2).toFixed(0); t.dataset.cy=(box.y+box.h/2).toFixed(0);
  t.innerHTML=`<div class="tf">${html}</div>`+
    (MODE==='hex'?`<svg class="hexrim" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="${HEXPTS}"/></svg>`:'');
  WALL_W=Math.max(WALL_W,box.x+box.w); WALL_H=Math.max(WALL_H,box.y+box.h);
  wallEl.appendChild(t);
  return t;
}

/* ── the work ─────────────────────────────────────────────────── */
WORK.forEach(w=>{
  const tier=TIER[w.cat];
  const box=boxFor({col:w.col,row:w.row,span:SPAN[w.cat]},tier);
  const plaque=w.cat.startsWith('plaque');
  const body=
    `<div class="halo"></div>`+
    (plaque?'':`<div class="print">${makePrint()}</div>`)+
    `<div class="mark">${MARK[w.mark]||''}</div>`+
    `<div class="stage${w.unbuilt?' idea':''}">${w.stage}</div>`+
    `<div class="plate"><span class="pname">${w.id}</span><span class="pgloss">${w.gloss}</span></div>`+
    (MODE==='rect'?`<div class="rim"></div>`:'');
  const t=mkTile(box,'live'+(plaque?' plaque':'')+(w.cat==='note'?' nt':''),tier,body);
  t.tabIndex=0; t.setAttribute('role','button'); t.dataset.id=w.id;
  t.setAttribute('aria-label',`${w.id} — ${w.gloss}. ${KIND[w.cat]}.`);
  const d=DEPTH[tier];
  t.style.transform=`translateZ(${d}px)`;
  SHADOW.push({el:t,depth:d});
  LIVE.push({x:box.x,y:box.y,w:box.w,h:box.h});
});

/* ── where the wall has failed ─────────────────────────────────────
   Choosing cavities by independent random rolls clumped them wherever the
   rolls happened to fall — one third of the wall ended up with eleven plants
   and another with none. They are now stratified: every region of a 3x3
   partition gets a quota, no two cavities touch, and one is pinned beside the
   entry point so there is greenery in the opening frame.
   ────────────────────────────────────────────────────────────────── */
const GAPCELLS=(function(){
  const RX=4,RY=3,out=new Set(),bucket={};   // finer partition = tighter spread
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(occ.has(c+','+r))continue;
    const k=Math.min(RX-1,Math.floor(c/COLS*RX))+','+Math.min(RY-1,Math.floor(r/ROWS*RY));
    (bucket[k]=bucket[k]||[]).push([c,r]);
  }
  const touches=(c,r)=>{
    if(out.has(c+','+r))return true;
    const nb = MODE==='hex' ? hexNeighbours(c,r)
             : [[c-1,r],[c+1,r],[c,r-1],[c,r+1]];
    return nb.some(([a,b2])=>out.has(a+','+b2));
  };
  const take=(c,r)=>{ if(!occ.has(c+','+r)&&!touches(c,r)){out.add(c+','+r);return true;} return false; };
  take(1,1) || take(0,0) || take(2,0);          // beside the entry point
  Object.keys(bucket).sort().forEach(k=>{
    const list=bucket[k];
    for(let i=list.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
    const want = 2;      // uniform quota: a bottom-row bonus skewed the wall
    let got=0;
    for(const [c,r] of list){ if(got>=want)break; if(take(c,r))got++; }
  });
  return out;
})();

/* ── decoration fills every remaining cell ────────────────────── */
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  if(occ.has(c+','+r))continue;
  const radius = MODE==='hex'?cellR[c+','+r]:undefined;
  const box=boxFor({col:c,row:r,span:[1,1],radius},'dec');
  const roll=rnd();
  if(GAPCELLS.has(c+','+r)){
    mkTile(box,'gap',null,'<div class="inner"></div>'+substrate(box.w,box.h));
    GAPS.push({cx:box.x+box.w/2, x:box.x, y:box.y, w:box.w, h:box.h,
               soilY:box.y+box.h*SOIL_TOP,          // exact surface to plant on
               r:radius!==undefined?radius:1, row:r,
               nearBig:NEARBIG.has(c+','+r)});
    continue;
  }
  let extra='';
  if(rnd()<0.3){const s=rr(26,70);
    extra+=`<div class="blotch" style="width:${s.toFixed(0)}px;height:${(s*rr(.6,1.1)).toFixed(0)}px;left:${rr(-10,Math.max(2,box.w-26)).toFixed(0)}px;top:${rr(-8,Math.max(2,box.h-26)).toFixed(0)}px;background:rgba(88,64,38,${rr(.16,.36).toFixed(2)})"></div>`;}
  if(rnd()<0.26){const s=rr(12,32);
    extra+=`<div class="lich" style="width:${s.toFixed(0)}px;height:${(s*rr(.7,1)).toFixed(0)}px;left:${rr(-4,Math.max(2,box.w-12)).toFixed(0)}px;top:${rr(box.h*.4,Math.max(box.h*.45,box.h-8)).toFixed(0)}px"></div>`;}
  if(rnd()<0.2)
    extra+=`<div class="drip" style="left:${rr(6,Math.max(8,box.w-6)).toFixed(0)}px;top:${rr(3,10).toFixed(0)}px;height:${rr(14,box.h*.78).toFixed(0)}px"></div>`;
  const nRiv = box.w>90?ri(1,3):1;
  for(let i=0;i<nRiv;i++)
    extra+=`<div class="rivet" style="left:${rr(5,Math.max(7,box.w-8)).toFixed(0)}px;top:${rr(5,Math.max(7,box.h-8)).toFixed(0)}px"></div>`;
  const m=rnd();
  const mat = m<0.16?'rst' : m<0.44?'mtl' : 'con';
  const t=mkTile(box,mat,null,`<div class="print">${makePrint()}</div>`+extra);
  /* Every translateZ inside a preserve-3d context is a layer the compositor
     must sort and rasterise, so relief is rationed: about a quarter of the
     background is raised rather than half, and the shallowest tier is gone
     because its shadow was never visible anyway. */
  let d=0;
  if(roll<0.13)d=13; else if(roll<0.26)d=8;
  if(d){
    t.style.transform=`translateZ(${d}px)`;
    /* background tiles get a fixed shadow set once — only the living tiles
       are re-lit every frame, which is what keeps the pan responsive */
    t.style.filter=`drop-shadow(${(-d*0.42).toFixed(1)}px ${(d*0.56).toFixed(1)}px ${(d*0.8+5).toFixed(0)}px rgba(6,4,2,.72))`;
  }
}

/* ── normalise every specimen to fill its own frame ─────────────────
   The generators draw at whatever scale their maths produces — a tight
   logarithmic spiral covered a quarter of the tile while a fern overflowed
   it. Re-fitting each viewBox to its own content makes them all read at a
   consistent size without hand-tuning thirty generators. One layout pass at
   build, nothing per frame. */
(function fitPrints(){
  let fixed=0;
  document.querySelectorAll('.print svg').forEach(svg=>{
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,n=0;
    svg.querySelectorAll('path,circle,ellipse,rect').forEach(g=>{
      let bb; try{bb=g.getBBox();}catch(e){return;}
      if(!bb||(bb.width<0.01&&bb.height<0.01))return;
      mnx=Math.min(mnx,bb.x); mxx=Math.max(mxx,bb.x+bb.width);
      mny=Math.min(mny,bb.y); mxy=Math.max(mxy,bb.y+bb.height); n++;
    });
    if(!n||mxx<=mnx) return;
    const w=mxx-mnx, hh=mxy-mny, m=Math.max(w,hh), pad=m*0.07;
    svg.setAttribute('viewBox',
      `${(mnx-(m-w)/2-pad).toFixed(1)} ${(mny-(m-hh)/2-pad).toFixed(1)} ${(m+pad*2).toFixed(1)} ${(m+pad*2).toFixed(1)}`);
    fixed++;
  });
  return fixed;
})();

/* ── no 4x4 window of cells may be pure background ───────────────── */
(function coverage(){
  const live=new Set(WORK.map(w=>w.col+','+w.row)), empty=[];
  for(let r=0;r<=ROWS-4;r++)for(let c=0;c<=COLS-4;c++){
    let any=false;
    for(let y=r;y<r+4&&!any;y++)for(let x=c;x<c+4;x++) if(live.has(x+','+y)){any=true;break;}
    if(!any) empty.push(c+','+r);
  }
  if(empty.length) console.warn('DEAD ZONES (empty 4x4 windows at col,row):',empty);
})();


/* ══════════════════════════════════════════════════════════════════
   PLANT ASSEMBLY
   A plant is a static head plus zero or more jointed trailers, each of
   which sways on its own chain. Nothing is a lone strand: pearls come as a
   bundle of 5–8, ferns as a clump of 4–6 fronds.
   ══════════════════════════════════════════════════════════════════ */
function trailerChain(segs,segLen,scale,P,kind,varie,leafFrom){
  let inner='';
  for(let i=segs-1;i>=0;i--){
    const sw=4.2*scale*(1-i/segs*.42);
    let body=stem(segLen,sw,P);
    const shrink=1-i*0.075;
    for(let k=0;k<2;k++){
      const yy=segLen*(.34+k*.42), side=((i+k)%2)?1:-1;
      const L=leafFrom*scale*shrink*rr(.84,1.1);
      if(L<7) continue;
      body+=`<g transform="translate(${f1(side*2*scale)},${f1(yy)}) rotate(${f1(side*rr(48,80)+rr(-6,6))})">`+
        stem(L*.2,2*scale,P)+
        `<g transform="translate(${f1(side*2*scale)},${f1(L*.2)})">`+
          leaf(L,L*(kind==='monstera'?.5:kind==='ivy'?.48:.44),P,varie&&rnd()>.22,side<0,kind)+
        `</g></g>`;
    }
    inner=`<g class="jt" transform="translate(0,${i===0?0:f1(segLen)}) rotate(0)">${body}${inner}</g>`;
  }
  return inner;
}
function pearlChain(segs,segLen,scale,P){
  let inner='';
  for(let i=segs-1;i>=0;i--){
    let body=`<path d="M0,0 Q${f1(1.6*scale)},${f1(segLen*.5)} 0,${f1(segLen)}" fill="none"
      stroke="${P.line}" stroke-width="${f1(2.2*scale)}" stroke-linecap="round"/>`;
    for(const[fy,r0] of [[.40,5.2],[.86,4.8]]){
      const r=(r0-i*.1)*scale, ox=(i%2?1:-1)*1.8*scale*(fy>.6?-.7:1);
      body+=bead(ox,segLen*fy,r,P);
    }
    inner=`<g class="jt" transform="translate(0,${i===0?0:f1(segLen)}) rotate(0)">${body}${inner}</g>`;
  }
  return inner;
}
function frondChain(segs,segLen,scale,P){
  let inner='';
  for(let i=segs-1;i>=0;i--){
    const sc=1-i/segs*.4;
    let body=stem(segLen,2.8*scale*sc,P);
    const n=6;
    for(let k=0;k<n;k++){
      const yy=segLen*(k/n)+segLen*.1, L=24*scale*sc*(1-k/n*.3);
      body+=`<g transform="translate(0,${f1(yy)}) rotate(${f1(-74+rr(-5,5))})">${leaf(L,L*.2,P,false,false,'cordate')}</g>`;
      body+=`<g transform="translate(0,${f1(yy+2.5)}) rotate(${f1(74+rr(-5,5))})">${leaf(L,L*.2,P,false,true,'cordate')}</g>`;
    }
    inner=`<g class="jt" transform="translate(0,${i===0?0:f1(segLen)}) rotate(0)">${body}${inner}</g>`;
  }
  return inner;
}

const PLANTS=[],ANCHORS=[];
/* Footprint per species at scale 1: [halfWidth, drop below origin, rise above].
   Sitters barely drop and rise a lot; spillers do the opposite. */
const FOOT={
  airplant :[46, 14, 48],
  spider   :[74, 16, 68],
  mossmound:[34, 12, 26],
  pearls   :[64, 250, 10],
  philo    :[92, 210, 26],
  pothos   :[86, 220, 26],
  ivy      :[84, 210, 26],
  monstera :[96, 200, 26],
  fernclump:[74, 180, 20]
};
const SITS=new Set(['airplant','spider','mossmound']);
function plantFoot(type,scale){
  const f=FOOT[type]||FOOT.pothos;
  return [f[0]*scale, f[1]*scale, f[2]*scale];
}

const LEAFY=new Set(['philo','pothos','ivy','monstera']);
function makePlant(x,y,type,scale){
  const P = LEAFY.has(type) ? GREENS[ri(0,GREENS.length-1)]
                            : PALS[ri(0,PALS.length-1)];
  const holder=document.createElement('div');
  holder.className='plant';
  holder.style.cssText=`left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:1px;height:1px`;
  let head='', chains=[];

  if(type==='airplant'){
    head=rosette(scale,P);
  } else if(type==='spider'){
    head=spider(scale,P);
  } else if(type==='mossmound'){
    head=mound(scale,P);
  } else if(type==='pearls'){
    const n=ri(6,9);
    for(let i=0;i<n;i++){
      const segs=ri(5,6), segLen=34*scale;
      chains.push({ox:rr(-34,34)*scale, oy:rr(-2,7)*scale, segLen,
        html:pearlChain(segs,segLen,scale,P)});
    }
    head=`<ellipse cx="0" cy="${f1(2*scale)}" rx="${f1(30*scale)}" ry="${f1(7*scale)}" fill="${P.dark}" opacity=".7"/>`;
  } else if(type==='fernclump'){
    const n=ri(4,6);
    for(let i=0;i<n;i++){
      const segs=ri(2,3), segLen=38*scale;
      chains.push({ox:rr(-16,16)*scale, oy:rr(-2,6)*scale, segLen, lean:rr(-34,34),
        html:frondChain(segs,segLen,scale,P)});
    }
  } else {
    const kind = type==='monstera'?'monstera' : type==='ivy'?'ivy' : 'cordate';
    const varie = type!=='monstera';   // most trailing vines are variegated
    head=basal(scale,P,varie,kind);
    /* One or two strands only. Bundling large-leaf vines makes them read as
       a rendering error; clustering is reserved for the thin strands. */
    const n=ri(1,2);
    for(let i=0;i<n;i++){
      const segs=ri(4,5), segLen=42*scale;
      chains.push({ox:(n===1?rr(-6,6):(i?1:-1)*rr(10,20))*scale, oy:rr(4,12)*scale, segLen,
        html:trailerChain(segs,segLen,scale,P,kind,varie,62)});
    }
  }

  const [hw,drop]=plantFoot(type,scale);
  const padX=Math.max(hw+90,150), padY=Math.max(drop+90,150);
  let body=head?`<g>${head}</g>`:'';
  chains.forEach((c,i)=>{
    body+=`<g class="ch" data-i="${i}" transform="translate(${f1(c.ox)},${f1(c.oy)})">`+
          `<g class="jt" transform="rotate(${f1(c.lean||0)})">${c.html}</g></g>`;
  });
  holder.innerHTML=`<svg width="${(padX*2).toFixed(0)}" height="${(padY+120).toFixed(0)}"
    viewBox="${-padX} ${-100} ${padX*2} ${padY+120}"
    style="position:absolute;left:${(-padX).toFixed(0)}px;top:-100px">${body}</svg>`;
  floraEl.appendChild(holder);

  const built=[...holder.querySelectorAll('.ch')].map(w=>{
    const joints=[...w.querySelectorAll('.jt')];
    return {joints,n:joints.length,segLen:0,
      a:new Float32Array(joints.length),v:new Float32Array(joints.length),
      phase:rr(0,6.283),rate:rr(.7,1.3),stiff:rr(.015,.023),damp:.952,lean:rr(-2,2),
      segLens:joints.map((j,idx)=>{
        const m=/translate\(0,([\d.]+)\)/.exec(j.getAttribute('transform'));
        return m?parseFloat(m[1]):0;
      })};
  });
  ANCHORS.push({x,y,span:drop+40});
  if(built.length) PLANTS.push({chains:built, x, y, hw:hw+40, drop:drop+60});
  return true;
}

/* ══════════════════════════════════════════════════════════════════
   PLANTING — everything is rooted in a cavity
   Every nook gets a static occupant. Most also get something spilling out
   of the cavity mouth. Nothing is attached to open wall, and nothing is
   placed above the top row, where there would be no wall behind it.
   ══════════════════════════════════════════════════════════════════ */
/* A graze is welcome — a cover is not. Where a cavity sits beside a heavy
   cell the vine is allowed up to 14% of it; everywhere else the cap is 6%. */
function canPlant(x,y,type,scale,cap){
  cap=cap||0.06;
  const [hw0,drop0,rise0]=plantFoot(type,scale);
  const hw=hw0*1.25, h=drop0*1.1, up=rise0*1.15;
  for(let i=0;i<LIVE.length;i++){
    const L=solidBox(LIVE[i]), pad=18;
    const lx=L.x-pad, ly=L.y-pad, lw=L.w+pad*2, lh=L.h+pad*2;
    const ox=Math.min(x+hw,lx+lw)-Math.max(x-hw,lx);
    const oy=Math.min(y+h,ly+lh)-Math.max(y-up,ly);
    if(ox>0&&oy>0 && (ox*oy)/(L.w*L.h) > cap) return false;
  }
  return true;
}
function tryPlant(x,y,type,scales,cap){
  for(const s of scales) if(canPlant(x,y,type,s,cap)) return makePlant(x,y,type,s);
  return false;
}

const HANGERS=['philo','pothos','pearls','ivy','monstera','fernclump'];
const SITTERS=['spider','airplant','spider','mossmound','airplant','spider'];
let hi=0, sj=0;
/* Everything is based on the FLOOR of the cavity or on the seam below it,
   never at the centre of a shape — an origin in the middle of a hexagon is
   what made these look spawned-in rather than grown. */
GAPS.forEach(g=>{
  const tiny = g.r < 0.50;
  const cap  = g.nearBig ? 0.14 : 0.06;

  /* Sitters go on the soil line, dead centre — offsetting them sideways is
     what made them look stuck to the wall of the cavity instead of growing
     out of its floor. Only the spiller gets nudged aside. */
  const floorY = g.soilY - g.h*0.02;
  const seamY  = g.y + g.h*0.84;
  const off    = g.w*0.20;

  /* 1 · something sits on the soil and fans upward out of the cavity.
     Scale is derived from the cavity width so it actually fills the space. */
  const fill = g.w/172;
  const sScales = tiny ? [fill*0.72,fill*0.58,fill*0.46]
                       : [fill,fill*0.84,fill*0.68,fill*0.54];
  if(tiny){ tryPlant(g.cx, floorY, 'mossmound', sScales, cap); }
  else for(let k=0;k<SITTERS.length;k++){
    if(tryPlant(g.cx, floorY, SITTERS[(sj+k)%SITTERS.length], sScales, cap)){ sj+=k+1; break; }
  }

  /* 2 · and something spills over the lower lip. Try the next species in
     rotation, but fall through to the others rather than skipping the cavity
     — advancing the index on failure was quietly starving whole species. */
  /* Attempt one in most cavities, and keep shrinking until it fits. The scale
     ladder matters more than the probability: cavities that failed outright
     were the main source of unevenness. */
  if(rnd()<0.78){
    const scales = g.nearBig ? [0.62,0.54,0.46,0.38,0.32,0.26,0.21]
                 : g.r<0.72  ? [0.46,0.39,0.33,0.28,0.23,0.19]
                             : [0.56,0.48,0.40,0.33,0.27,0.22];
    for(let k=0;k<HANGERS.length;k++){
      const type=HANGERS[(hi+k)%HANGERS.length];
      if(tryPlant(g.cx+off*(rnd()<.5?-1:1), seamY, type, scales, cap)){ hi+=k+1; break; }
    }
  }
});

/* ══════════════════════════════════════════════════════════════════
   PAN — opens on the about tile, top-left
   ══════════════════════════════════════════════════════════════════ */
let px=0,py=0,vx=0,vy=0,tx=0,ty=0,dragging=false,lastX=0,lastY=0,moved=0,breeze=0;
const bounds=()=>({minX:Math.min(0,innerWidth-WALL_W-90),maxX:90,
                   minY:Math.min(0,innerHeight-WALL_H-90),maxY:90});
/* Open framed on the about cell rather than jammed against the corner, so the
   entry point and its neighbours are both legible on a phone. */
(function openOnAbout(){
  const t=document.querySelector('[data-id="about"]');
  const b=bounds();
  if(!t){ tx=px=b.maxX; ty=py=b.maxY; return; }
  const ax=parseFloat(t.style.left)+parseFloat(t.style.width)/2;
  const ay=parseFloat(t.style.top)+parseFloat(t.style.height)/2;
  const fx=innerWidth<620?0.46:0.30, fy=innerWidth<620?0.30:0.32;
  tx=px=Math.max(b.minX,Math.min(b.maxX, innerWidth*fx-ax));
  ty=py=Math.max(b.minY,Math.min(b.maxY, innerHeight*fy-ay));
})();

vpEl.addEventListener('pointerdown',e=>{
  dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;vx=vy=0;
  vpEl.classList.add('dragging');vpEl.setPointerCapture(e.pointerId);
});
vpEl.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  tx+=dx;ty+=dy;vx=dx;vy=dy;breeze+=dx*0.030;hideHint();
},{passive:true});
const endDrag=e=>{if(!dragging)return;dragging=false;vpEl.classList.remove('dragging');
  if(e)try{vpEl.releasePointerCapture(e.pointerId);}catch(_){}}
vpEl.addEventListener('pointerup',e=>{
  const click=moved<7;endDrag(e);
  if(click){const el=document.elementFromPoint(e.clientX,e.clientY);
    const t=el&&el.closest&&el.closest('.live');if(t)openPanel(t.dataset.id);}
});
vpEl.addEventListener('pointercancel',endDrag);
vpEl.addEventListener('wheel',e=>{
  e.preventDefault();tx-=e.deltaX*1.05;ty-=e.deltaY*1.05;
  breeze-=e.deltaX*0.018;hideHint();if(panelOpen)closePanel();
},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanel();return;}
  const s=110;
  if(e.key==='ArrowLeft'){tx+=s;breeze+=3;hideHint();}
  if(e.key==='ArrowRight'){tx-=s;breeze-=3;hideHint();}
  if(e.key==='ArrowUp'){ty+=s;hideHint();}
  if(e.key==='ArrowDown'){ty-=s;hideHint();}
  if(e.key==='Enter'||e.key===' '){const t=document.activeElement;
    if(t&&t.classList.contains('live')){e.preventDefault();openPanel(t.dataset.id);}}
});
const hintEl=document.getElementById('hint');
let hintGone=false;
const hideHint=()=>{if(!hintGone){hintGone=true;hintEl.classList.add('gone');}};
setTimeout(hideHint,11000);

/* ── spores ──────────────────────────────────────────────────────── */
const mc=document.getElementById('motes');mc.width=innerWidth;mc.height=innerHeight;
const mx=mc.getContext('2d');const SPORES=[];
ANCHORS.forEach(A=>{for(let i=0;i<15;i++)SPORES.push({
  x:A.x+rr(-115,115),y:A.y+rr(-30,A.span*.85),r:rr(.7,2.3),o:rr(.3,1),
  ph:rr(0,6.283),dx:rr(-.05,.05),dy:rr(-.11,-.02),swirl:rr(.4,1.5),home:A});});
for(let i=0;i<90;i++){const A={x:rr(0,WALL_W),y:rr(0,WALL_H),span:WALL_H*.5};
  SPORES.push({x:A.x,y:A.y,r:rr(.5,1.6),o:rr(.18,.6),ph:rr(0,6.283),
    dx:rr(-.04,.04),dy:rr(-.08,-.01),swirl:rr(.3,1.2),home:A});}

/* ── solver: independent damped springs, exponential damping ─────── */
/* The arithmetic here is trivial; the cost is the SVG transform writes, each
   of which invalidates a nested subtree. So the physics always integrates —
   plants must not jump when they scroll into view — but only visible plants
   are written to the DOM, and only on alternate frames. */
function stepPlants(now,dt,write){
  breeze*=Math.pow(.965,dt);
  if(breeze>6)breeze=6;else if(breeze<-6)breeze=-6;
  const w=now*0.00026; let tip=0, nc=0;
  const W=innerWidth, H=innerHeight;
  for(let p=0;p<PLANTS.length;p++){
    const PL=PLANTS[p], CH=PL.chains;
    const sx=PL.x+px, sy=PL.y+py;
    const vis = write && sx>-PL.hw-60 && sx<W+PL.hw+60 && sy>-260 && sy<H+PL.drop;
    for(let ci=0;ci<CH.length;ci++){
      const C=CH[ci], r=C.rate;
      const amb=Math.sin(w*r+C.phase)*1.5+Math.sin(w*r*2.1+C.phase*1.7)*.55;
      for(let i=0;i<C.n;i++){
        const target=C.lean+amb*(.34+i*.075)-breeze*(.10+i*.032);
        const k=C.stiff*(1-i/C.n*.55);
        let v=(C.v[i]+(target-C.a[i])*k*dt)*Math.pow(C.damp,dt);
        if(v>.55)v=.55;else if(v<-.55)v=-.55;
        C.v[i]=v;
        let a=C.a[i]+v*dt;
        if(a>16)a=16;else if(a<-16)a=-16;
        C.a[i]=a;
        if(vis) C.joints[i].setAttribute('transform',
          `translate(0,${C.segLens[i].toFixed(1)}) rotate(${a.toFixed(2)})`);
      }
      tip+=Math.abs(C.v[C.n-1]); nc++;
    }
  }
  return nc?tip/nc:0;
}
if(!RM){const t=performance.now();
  for(let s=0;s<400;s++)stepPlants(t+s*16.67,1,false);
  stepPlants(t+400*16.67,1,true);}

/* ── loop ───────────────────────────────────────────────────────── */
let t0=performance.now(),frame=0,relight=true,running=true;
function tick(now){
  const dt=Math.min(2.2,(now-t0)/16.67);t0=now;frame++;
  if(!dragging){tx+=vx;ty+=vy;vx*=.945;vy*=.945;
    if(Math.abs(vx)<.04)vx=0;if(Math.abs(vy)<.04)vy=0;}
  const b=bounds();
  if(tx>b.maxX)tx+=(b.maxX-tx)*.16;if(tx<b.minX)tx+=(b.minX-tx)*.16;
  if(ty>b.maxY)ty+=(b.maxY-ty)*.16;if(ty<b.minY)ty+=(b.minY-ty)*.16;
  const ppx=px,ppy=py;
  /* 1:1 while the finger is down — any smoothing here reads as lag.
     Easing is only for the inertial glide after release. */
  if(dragging){px=tx;py=ty;}
  else{px+=(tx-px)*.30;py+=(ty-py)*.30;}
  worldEl.style.transform=`translate3d(${px.toFixed(2)}px,${py.toFixed(2)}px,0)`;
  const still=Math.abs(px-ppx)<.05&&Math.abs(py-ppy)<.05;

  if(!still||relight){
    relight=false;
    const lampX=innerWidth*.5,lampY=innerHeight*.44,kx=-.6,ky=.8;
    for(let i=0;i<SHADOW.length;i++){
      const T=SHADOW[i];
      const sx=+T.el.dataset.cx+px,sy=+T.el.dataset.cy+py;
      if(sx<-340||sx>innerWidth+340||sy<-340||sy>innerHeight+340)continue;
      let lx=sx-lampX,ly=sy-lampY;const d=Math.hypot(lx,ly)||1;lx/=d;ly/=d;
      const near=Math.max(0,1-d/1000);
      const ox=(kx*.72+lx*.5*near)*T.depth*.68,oy=(ky*.72+ly*.5*near)*T.depth*.68;
      const blur=T.depth*1.2+9;
      T.el.style.filter=`drop-shadow(${(ox*1.5).toFixed(1)}px ${(oy*1.5).toFixed(1)}px ${blur.toFixed(0)}px rgba(6,4,2,.8))`;
    }
  }

  const tipMotion=RM?0:stepPlants(now,dt,frame%2===0);

  if(!RM&&SPORES.length){
    mx.clearRect(0,0,mc.width,mc.height);
    const stir=tipMotion*.9+Math.abs(breeze)*.10;
    for(let i=0;i<SPORES.length;i++){
      const s=SPORES[i];
      s.x+=(s.dx+Math.sin(now*.0004*s.swirl+s.ph)*.16+breeze*.028+stir*s.swirl*.5)*dt;
      s.y+=(s.dy+Math.cos(now*.00032*s.swirl+s.ph)*.1-stir*.16)*dt;
      const A=s.home;
      if(s.y<A.y-120)s.y=A.y+A.span*.8;
      if(s.y>A.y+A.span*.95)s.y=A.y-100;
      if(s.x<A.x-170)s.x=A.x+170;if(s.x>A.x+170)s.x=A.x-170;
      const X=s.x+px,Y=s.y+py;
      if(X<-10||X>mc.width+10||Y<-10||Y>mc.height+10)continue;
      const al=s.o*(.45+.55*Math.sin(now*.0011+s.ph));
      mx.beginPath();mx.arc(X,Y,s.r*3.2,0,6.284);
      mx.fillStyle=`rgba(214,196,138,${(al*.10).toFixed(3)})`;mx.fill();
      mx.beginPath();mx.arc(X,Y,s.r,0,6.284);
      mx.fillStyle=`rgba(240,232,198,${(al*.78).toFixed(3)})`;mx.fill();
    }
  }
  if(running)requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)running=false;
  else if(!running){running=true;t0=performance.now();relight=true;requestAnimationFrame(tick);}
});
addEventListener('resize',()=>{mc.width=innerWidth;mc.height=innerHeight;relight=true;});

/* ── panel ──────────────────────────────────────────────────────── */
const scrim=document.getElementById('scrim'),panel=document.getElementById('panel'),pin=document.getElementById('pin');
let panelOpen=false,lastFocus=null;
function focusTile(id){
  const t=document.querySelector(`.live[data-id="${id}"]`);if(!t)return;
  const b=bounds();
  tx=Math.max(b.minX,Math.min(b.maxX,innerWidth/2-(+t.dataset.cx)));
  ty=Math.max(b.minY,Math.min(b.maxY,innerHeight/2-(+t.dataset.cy)));
  vx=vy=0;relight=true;
}
function openPanel(id,skipHash){
  const w=WORK.find(x=>x.id===id);if(!w)return;
  lastFocus=document.activeElement;
  if(!skipHash&&location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);
  pin.innerHTML=`<button id="pclose">Close ✕</button>`+
    `<div class="pmark">${MARK[w.mark]||''}</div>`+
    `<p class="pkind${w.unbuilt?' idea':''}">${KIND[w.cat]}</p>`+
    `<p class="ptax">${w.taxon}</p>`+
    `<h2 class="pcode" id="pcode">${w.id}</h2>`+
    `<p class="pgl">${w.gloss}</p>`+
    (w.title?`<h3 class="ptitle">${w.title}</h3>`:'')+
    `<div class="pbody">${w.body}</div>`+
    (Object.keys(w.facts).length?`<div class="pfacts"><dl>${Object.entries(w.facts).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`:'')+
    `<div class="plinks">${w.links.map(([l,h,td])=>
      `<a href="${h}"${h!=='#'?' target="_blank" rel="noopener"':''} class="${td?'todo':''}">${l}</a>`).join('')}</div>`;
  scrim.classList.add('on');panel.classList.add('on');panelOpen=true;
  document.getElementById('pclose').onclick=closePanel;
  panel.scrollTop=0;panel.focus?.();
}
function closePanel(){
  if(!panelOpen)return;
  scrim.classList.remove('on');panel.classList.remove('on');panelOpen=false;
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
scrim.addEventListener('pointerdown',closePanel);
function fromHash(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return;
  if(WORK.some(w=>w.id===id)){focusTile(id);openPanel(id,true);hideHint();}}
addEventListener('hashchange',fromHash);fromHash();

</script>
</body>
